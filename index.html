<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV-Auswertung</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1b1f24; --ink2:#4a525c; --muted:#6b7480;
  --accent:#2563c9; --line:#d9dde2; --axis:#c3c9d0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --card:#181c22; --ink:#e8eaed; --ink2:#b4bac3; --muted:#8e97a3;
    --accent:#6aa3ff; --line:#2c333b; --axis:#3a424c;
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;gap:4px}
.tab{font:inherit;color:var(--ink2);background:transparent;border:1px solid transparent;border-bottom:none;
  border-radius:10px 10px 0 0;padding:9px 18px;cursor:pointer;position:relative;top:1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;background:var(--card);border-color:var(--line)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;top:-1px;height:3px;
  border-radius:0 0 3px 3px;background:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
iframe{display:block;width:100%;border:0;background:transparent;min-height:480px}
iframe[hidden]{display:none}
</style>
</head>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);

main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 2px;font-weight:650}
.sub{color:var(--ink2);margin:0 0 18px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.controls button,.controls select{
  font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:7px 12px;cursor:pointer}
.controls button:hover:not(:disabled),.controls select:hover{border-color:var(--axis)}
.controls button:disabled{opacity:.4;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:3px}
.kpi .s{color:var(--ink2);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 8px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 6px;font-weight:600}
.card h2 span{color:var(--muted);font-weight:400;margin-left:4px}
.note{color:var(--muted);font-size:12.5px;margin:4px 0 8px}
svg{display:block;overflow:visible}
svg text{fill:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.tip{position:fixed;pointer-events:none;z-index:10;background:var(--card);color:var(--ink);
  border:1px solid var(--axis);border-radius:8px;padding:7px 10px;font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;white-space:nowrap}
.tip b{font-variant-numeric:tabular-nums}
.tip .t{color:var(--ink2);font-size:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;margin-top:10px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:4px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:13px}
.tablewrap{max-height:340px;overflow:auto}
.empty{padding:40px;text-align:center;color:var(--ink2)}

function plot(host, kind, S, idx, M) {

    }
    if (S.mean[i] == null) { showTip(`&lt;span class=&quot;t&quot;&gt;${hhmm(i)} Uhr&lt;/span&gt;&lt;br&gt;keine Daten`, ev); return; }

$(&quot;day&quot;).innerHTML = D.names.map(d =&gt; `&lt;option value=&quot;${d}&quot;&gt;${dLong(d)}&lt;/option&gt;`).join(&quot;&quot;);
$(&quot;day&quot;).onchange = e =&gt; { cur = D.names.indexOf(e.target.value); render(); };
$(&quot;prev&quot;).onclick = () =&gt; { cur = Math.max(0, cur - 1); render(); };
$(&quot;next&quot;).onclick = () =&gt; { cur = Math.min(D.names.length - 1, cur + 1); render(); };
$(&quot;showDay&quot;).onchange = e =&gt; { showDay = e.target.checked; render(); };
$(&quot;bP&quot;).onclick = () =&gt; { mode = &quot;power&quot;; render(); };
$(&quot;bE&quot;).onclick = () =&gt; { mode = &quot;cum&quot;; render(); };
let raf; new ResizeObserver(() =&gt; { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }).observe(document.querySelector(&quot;main&quot;));
render();
&lt;/script&gt;
&lt;script&gt;
(function () {
  function send() { parent.postMessage({sungrowHeight: Math.ceil(document.body.getBoundingClientRect().height), tab: &quot;monatsvergleich&quot;}, &quot;*&quot;); }
  new ResizeObserver(send).observe(document.body);

"></iframe>
<script>
const TABS = ["verlauf", "durchschnitt", "vergleich", "monatsvergleich"];
const frame = t => document.getElementById("f-" + t);
const tabBtn = t => document.getElementById("t-" + t);

function select(t, focus) {
  if (!TABS.includes(t)) t = TABS[0];
  TABS.forEach(x => {
    const on = x === t;
    frame(x).hidden = !on;
    tabBtn(x).setAttribute("aria-selected", on);
    tabBtn(x).tabIndex = on ? 0 : -1;
  });
  if (focus) tabBtn(t).focus();
  try { history.replaceState(null, "", "#" + t); } catch (e) {}
  try { localStorage.setItem("pvTab", t); } catch (e) {}
  window.scrollTo(0, 0);
}

TABS.forEach(t => tabBtn(t).addEventListener("click", () => select(t)));
document.querySelector(".tabs").addEventListener("keydown", e => {
  const i = TABS.findIndex(t => tabBtn(t).getAttribute("aria-selected") === "true");
  if (e.key === "ArrowRight") { e.preventDefault(); select(TABS[(i + 1) % TABS.length], true); }
  if (e.key === "ArrowLeft") { e.preventDefault(); select(TABS[(i + TABS.length - 1) % TABS.length], true); }
});

// Höhe der eingebetteten Seiten übernehmen
addEventListener("message", e => {
  const d = e.data;
  if (!d || typeof d.sungrowHeight !== "number" || !TABS.includes(d.tab) || d.sungrowHeight <= 0) return;
  frame(d.tab).style.height = d.sungrowHeight + "px";
});

let start = location.hash.slice(1);
if (!TABS.includes(start)) { try { start = localStorage.getItem("pvTab"); } catch (e) {} }
select(start);
</script>
</body>
